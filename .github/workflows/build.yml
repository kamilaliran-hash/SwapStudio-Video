name: Build APK and EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Fetch face engine
        run: bash scripts/fetch-assets.sh
      - name: Bundle web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk SwapStudioVideo.apk
      - uses: actions/upload-artifact@v4
        with: { name: SwapStudioVideo-android, path: SwapStudioVideo.apk }
      - name: Publish APK to apk-build branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp SwapStudioVideo.apk out/ && cd out
          git init -q -b apk-build
          git config user.name github-actions && git config user.email actions@github.com
          git add SwapStudioVideo.apk && git commit -qm "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: SwapStudioVideo.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch face engine
        shell: bash
        run: bash scripts/fetch-assets.sh
      - name: Bundle web app
        shell: bash
        run: mkdir -p desktop/www && cp -r web/. desktop/www/
      - name: Build portable EXE
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: SwapStudioVideo-windows, path: desktop/dist/*.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: desktop/dist/*.exe }
